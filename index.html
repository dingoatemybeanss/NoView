<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Surveillance Census</title>

  <!-- Leaflet + Cluster + Heat -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://unpkg.com/leaflet-heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="header">
  <button class="back-btn" id="backBtn">← Back</button>
  <h1>📷 <span>Surveillance</span> Census</h1>
</div>

<div id="viewContainer">

  <!-- HOME -->
  <div id="homeView" class="active">
    <h2>What do you want to do?</h2>
    <div class="sub">Map the surveillance state.</div>
    <button class="home-btn camera" id="goCameraBtn">📸 Take Photos</button>
    <button class="home-btn map" id="goMapBtn">🗺️ View Map</button>
    <button class="home-btn route" id="goRouteBtn">🛣️ Route Exposure Score</button>
  </div>

  <!-- CAPTURE -->
  <div id="captureView">
    <video id="videoPreview" autoplay playsinline></video>
    <div id="captureStatus">📸 Tap "Open Camera" to start</div>
    <button id="openCameraBtn">📸 Open Camera</button>
    <button id="shutterBtn" style="display:none;"></button>
  </div>

  <!-- PREVIEW -->
  <div id="previewView">
    <div class="preview-img"><img id="previewImg" /></div>
    <div id="previewControls">
      <button class="retake" id="retakeBtn">✖️ Retake</button>
      <button class="crop" id="cropBtn">✂️ Crop</button>
    </div>
  </div>

  <!-- CROP -->
  <div id="cropView">
    <div class="crop-container"><canvas id="cropCanvas"></canvas></div>
    <div id="cropStatus">✂️ Drag to select the camera</div>
    <div id="cropControls">
      <button class="cancel-crop" id="cancelCropBtn">✖️ Cancel</button>
      <button class="confirm-crop" id="confirmCropBtn">✅ Crop & Upload</button>
    </div>
  </div>

  <!-- MAP -->
  <div id="mapView">
    <div id="map"></div>
    <button id="heatmapToggle">🔥 Heatmap</button>
    <button id="exportBtn">📥 Export GeoJSON</button>
  </div>

  <!-- ROUTE -->
  <div id="routeView">
    <h3>🛣️ Surveillance Exposure Score</h3>
    <div class="route-input-group">
      <div style="display:flex;gap:8px;align-items:center;">
        <input type="text" id="routeStart" placeholder="Start (address or lat,lng)" style="flex:1;" />
        <button id="startLocBtn" class="loc-btn" title="Use current location">📍</button>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <input type="text" id="routeEnd" placeholder="End (address or lat,lng)" style="flex:1;" />
        <button id="endLocBtn" class="loc-btn" title="Use current location">📍</button>
      </div>
    </div>
    <div style="display:flex;gap:8px;">
      <button id="calcRouteBtn">Calculate Exposure</button>
      <button id="refreshRouteBtn" style="background:#2a2a2a;border:1px solid #444;">⟳ Refresh Data</button>
    </div>
    <div id="routeResult">Enter a route and hit calculate.</div>
  </div>

</div>

<div class="status-bar" id="status">🔵 Ready</div>

<script type="importmap">
  {
    "imports": {
      "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"
    }
  }
</script>

<script type="module" src="app.js"></script>
</body>
</html>
